name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tests_failed: ${{ steps.flag.outputs.tests_failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run Jest
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log
      - name: Flag test failure
        id: flag
        if: failure() && steps.tests.outcome == 'failure'
        run: echo "tests_failed=true" >> "$GITHUB_OUTPUT"
      - name: Upload failure log
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log

  auto-fix:
    needs: test
    # Runs only when the Jest step failed on a pull request. Patch branches are
    # skipped so a failed fix can never trigger another fix attempt.
    if: >-
      failure() &&
      needs.test.outputs.tests_failed == 'true' &&
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'fix/auto-heal-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_REF: ${{ github.head_ref }}
      PATCH_BRANCH: fix/auto-heal-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: test-results
      - run: npm ci
      - name: Generate patch with the AI agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/scripts/auto-heal.ts test-results.log "$RUNNER_TEMP/agent-summary.md"
      - name: Verify the patch restores the test suite
        run: npm run lint && npm test
      - name: Open the remediation pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$PATCH_BRANCH"
          git add src
          git commit -m "fix(auto-heal): repair failing tests from run ${{ github.run_id }}"
          git push origin "$PATCH_BRANCH"
          {
            echo "## Auto-heal patch"
            echo
            echo "Generated by the \`auto-fix\` job after the \`test\` job failed on \`$HEAD_REF\`."
            echo "Lint and the full Jest suite pass on this branch."
            echo
            echo "### Agent explanation"
            cat "$RUNNER_TEMP/agent-summary.md"
            echo
            echo "### Audit log (human-in-the-loop review)"
            echo "_To be completed by the reviewer before merging:_"
            echo "- [ ] Diff changes production code only; no test assertions were altered"
            echo "- [ ] Root cause matches the original failing log"
            echo "- [ ] Fix is the minimal correct change, not a workaround"
            echo "- [ ] Full suite re-run locally or in CI"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$HEAD_REF" --head "$PATCH_BRANCH" \
            --title "fix(auto-heal): repair failing tests from run ${{ github.run_id }}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
